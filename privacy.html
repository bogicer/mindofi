let LANG = localStorage.getItem('mindofi_legal_lang') || 'en';

function render() {
  const t = T[LANG] || T.en;
  document.documentElement.lang = LANG;

  document.getElementById('backLink').textContent = t.back;

  let html = '<h1>' + t.title + '</h1>';
  html += '<p class="date">' + t.date + '</p>';

  t.sections.forEach(s => {
    html += '<h2>' + s.h + '</h2>' + s.b;
  });

  html += '<p style="margin-top:40px;color:#718096;font-size:13px;text-align:center">' + t.footer + '</p>';

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.lang-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === LANG);
  });
}

document.querySelectorAll('.lang-switch button').forEach(b => {
  b.addEventListener('click', () => {
    LANG = b.dataset.lang;
    localStorage.setItem('mindofi_legal_lang', LANG);
    render();
  });
});

render();
</script>
