<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MINDOFI</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="app.css?v=3">
</head>
<body>

<!-- ===== МОБИЛЬНЫЕ КНОПКИ (видны только на телефоне) ===== -->
<button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Меню">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<button class="mobile-profile-btn" id="mobileProfileBtn" onclick="openSettingsModal()" aria-label="Профиль">
  <span id="mobileProfileAvatar">?</span>
</button>

<!-- ===== OVERLAY (затемнение) ===== -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div id="app" class="app">

  <!-- ==================== САЙДБАР ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="MINDOFI" class="sidebar-logo">
      <span class="sidebar-title">MINDOFI</span>
      <div class="sidebar-actions">
        <button class="icon-btn" title="Новый чат" onclick="openNewChat()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="icon-btn mobile-close-btn" onclick="toggleSidebar()" aria-label="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <button class="icon-btn desktop-only" title="Тема" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" placeholder="Поиск..." oninput="filterChats(this.value)">
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="all" onclick="switchTab('all')">Все</div>
      <div class="tab" data-tab="groups" onclick="switchTab('groups')">Группы</div>
      <div class="tab" data-tab="channels" onclick="switchTab('channels')">Каналы</div>
    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <div class="me" onclick="openSettingsModal()">
        <div class="me-avatar" id="meAvatar">?</div>
        <div class="me-info">
          <div class="me-name" id="meName">—</div>
          <div class="me-status" id="meStatus">В сети</div>
        </div>
      </div>
      <button class="icon-btn" onclick="openSettingsModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ==================== ОСНОВНАЯ ОБЛАСТЬ ==================== -->
  <main class="main" id="mainArea">

    <div class="empty-state" id="emptyState">
      <img src="logo.png" alt="MINDOFI" class="empty-logo">
      <div class="empty-title">MINDOFI</div>
      <div class="empty-text">Выберите чат слева или создайте новый</div>
    </div>

    <div class="chat" id="chatArea" style="display:none">
      <div class="chat-header">
        <button class="icon-btn mobile-back-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="chat-avatar" id="chatAvatar" onclick="openProfile()">?</div>
        <div class="chat-info" onclick="openProfile()">
          <div class="chat-name" id="chatName">—</div>
          <div class="chat-status" id="chatStatus"></div>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" title="Аудиозвонок" onclick="initCall('audio')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.4 1.13 2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6z"/>
            </svg>
          </button>
          <button class="icon-btn" title="Видеозвонок" onclick="initCall('video')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="input-bar">
        <button class="icon-btn" title="Прикрепить файл" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" style="display:none" onchange="onFilePick(this)">

        <button class="icon-btn voice-btn-mobile" title="Голосовое" id="voiceBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <div class="input-wrapper">
          <textarea id="messageInput" rows="1" placeholder="Сообщение..."></textarea>
        </div>

        <button class="icon-btn send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- ==================== МОДАЛКА: НОВЫЙ ЧАТ ==================== -->
<div class="modal" id="newChatModal" style="display:none">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Новый чат</h3>
      <button class="icon-btn" onclick="closeModal('newChatModal')">✕</button>
    </div>
    <input type="text" id="userSearchInput" placeholder="Введите @username..." oninput="searchUsers(this.value)">
    <div id="userSearchResults" class="search-results"></div>
  </div>
</div>

<!-- ==================== МОДАЛКА: ПРОФИЛЬ ==================== -->
<div class="modal" id="settingsModal" style="display:none">
  <div class="modal-content settings-modal-content">
    <div class="modal-header">
      <h3>Профиль</h3>
      <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
    </div>

    <div class="settings-avatar-section">
      <div class="settings-avatar" id="settingsAvatar" onclick="document.getElementById('settingsAvatarInput').click()">
        <span>?</span>
        <div class="settings-avatar-overlay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
      </div>
      <input type="file" id="settingsAvatarInput" style="display:none" accept="image/*" onchange="onSettingsAvatarPick(this)">
      <div class="settings-hint">Нажмите, чтобы изменить фото</div>
    </div>

    <div class="settings-field">
      <label>Имя</label>
      <input type="text" id="settingsName" maxlength="40" placeholder="Ваше имя">
    </div>

    <div class="settings-field">
      <label>Username</label>
      <input type="text" id="settingsUsername" maxlength="30" placeholder="username">
    </div>

    <div class="settings-field">
      <label>О себе</label>
      <textarea id="settingsBio" maxlength="500" rows="3" placeholder="Немного о себе..."></textarea>
      <div class="settings-counter"><span id="bioCounter">0</span>/500</div>
    </div>

    <div class="settings-field">
      <label>Дата рождения</label>
      <input type="date" id="settingsBirthday" max="2013-12-31">
    </div>

    <button class="btn-primary" onclick="saveProfile()">Сохранить</button>

    <div class="settings-divider"></div>

    <div class="settings-section-title">Пароль</div>

    <div class="settings-field">
      <label>Текущий пароль</label>
      <input type="password" id="settingsCurrentPwd" placeholder="Пусто, если пароля нет">
    </div>

    <div class="settings-field">
      <label>Новый пароль</label>
      <input type="password" id="settingsNewPwd" placeholder="Минимум 6 символов">
    </div>

    <div class="settings-field">
      <label>Повторите новый пароль</label>
      <input type="password" id="settingsRepeatPwd" placeholder="Повтор">
    </div>

    <button class="btn-secondary" onclick="changePassword()">Сменить пароль</button>

    <div class="settings-divider"></div>

    <div class="settings-item" onclick="toggleTheme()">
      <span>🌙 Тёмная тема</span>
      <span id="themeValue">Вкл.</span>
    </div>

    <div class="settings-item" onclick="logout()" style="color:#dc2626">
      🚪 Выйти
    </div>

    <div class="settings-footer">MINDOFI v1.0 · 2026</div>
  </div>
</div>

<!-- ==================== ЭКРАН ЗВОНКА ==================== -->
<div class="call-screen" id="callScreen" style="display:none">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <div class="call-info" id="callInfo">
    <div class="call-avatar" id="callAvatar">?</div>
    <div class="call-name" id="callName">—</div>
    <div class="call-status" id="callStatus">Вызов...</div>
    <div class="call-timer" id="callTimer" style="display:none">00:00</div>
  </div>

  <div class="call-controls">
    <button class="call-btn" onclick="toggleMute()" id="muteBtn" title="Микрофон">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
        <path d="M19 10v2a7 7 0 01-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <button class="call-btn end" onclick="hangUp()" title="Завершить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.68 13.31a16 16 0 003.41 2.6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7 2 2 0 011.72 2v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.42 19.42 0 01-3.33-2.67m-2.67-3.34a19.79 19.79 0 01-3.07-8.63A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91"/>
        <line x1="23" y1="1" x2="1" y2="23"/>
      </svg>
    </button>

    <button class="call-btn" onclick="toggleCam()" id="camBtn" title="Камера">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
    </button>
  </div>
</div>

<!-- ==================== ВХОДЯЩИЙ ЗВОНОК ==================== -->
<div class="incoming-call" id="incomingCall" style="display:none">
  <div class="incoming-content">
    <div class="call-avatar" id="incomingAvatar">?</div>
    <div class="call-name" id="incomingName">—</div>
    <div class="call-status" id="incomingType">Входящий звонок</div>
    <div class="incoming-controls">
      <button class="call-btn end" onclick="declineCall()" title="Отклонить">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.4 1.13 2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6z"/>
        </svg>
      </button>
      <button class="call-btn accept" onclick="acceptCall()" title="Принять">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.4 1.13 2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
