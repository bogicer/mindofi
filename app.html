<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MINDOFI</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    /* ---------- БАЗА ---------- */
    :root {
      --bg: #ffffff;
      --bg-soft: #f5f6f8;
      --bg-elev: #ffffff;
      --border: #e3e5e8;
      --border-strong: #d1d4d8;
      --text: #1a1d21;
      --text-soft: #6b7075;
      --text-mute: #9aa0a6;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --ok: #16a34a;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.04);
    }
    [data-theme="dark"] {
      --bg: #16181b;
      --bg-soft: #1e2023;
      --bg-elev: #23262a;
      --border: #2e3236;
      --border-strong: #3a3f44;
      --text: #e8eaed;
      --text-soft: #a5aab0;
      --text-mute: #6f757b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --danger: #ef4444;
      --ok: #22c55e;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-soft);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, textarea { font: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }
    svg { display: block; }

    /* ---------- КНОПКИ ---------- */
    .icon-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-soft);
      transition: background .12s, color .12s, border-color .12s;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; }

    .btn-primary, .btn-secondary {
      width: 100%;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      font-weight: 600;
      font-size: 13px;
      transition: background .12s, border-color .12s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-secondary:hover { background: var(--bg-soft); }

    /* ---------- МОБІЛЬНІ КНОПКИ ---------- */
    .mobile-menu-btn, .mobile-profile-btn {
      position: fixed; top: 10px; z-index: 60;
      width: 38px; height: 38px;
      border-radius: var(--radius-sm);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      display: none; align-items: center; justify-content: center;
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .mobile-menu-btn { left: 10px; }
    .mobile-profile-btn { right: 10px; }
    .mobile-menu-btn svg { width: 20px; height: 20px; }
    .mobile-profile-btn span { font-weight: 600; font-size: 13px; }

    /* ---------- КАРКАС ---------- */
    .app {
      display: flex;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 40;
    }
    .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border-right: 1px solid var(--border);
    }
    .sidebar-header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo { width: 28px; height: 28px; border-radius: var(--radius-sm); }
    .sidebar-title { font-weight: 700; font-size: 15px; letter-spacing: .3px; flex: 1; }
    .sidebar-actions { display: flex; gap: 2px; }

    .search-box {
      position: relative;
      margin: 12px 12px 8px;
    }
    .search-box svg {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--text-mute);
    }
    .search-box input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      background: var(--bg-soft);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 13px;
      transition: border-color .12s, background .12s;
    }
    .search-box input:focus { border-color: var(--accent); background: var(--bg); }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px 12px 8px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-soft);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .tab:hover { background: var(--bg-soft); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; }

    .chat-list { flex: 1; overflow-y: auto; padding: 6px; }
    .chat-list::-webkit-scrollbar { width: 6px; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .sidebar-footer {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }
    .me { display: flex; align-items: center; gap: 10px; flex: 1; cursor: pointer; min-width: 0; }
    .me-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 13px;
      flex-shrink: 0;
    }
    .me-info { min-width: 0; }
    .me-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .me-status { font-size: 11.5px; color: var(--ok); }

    /* ---------- MAIN ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .empty-state {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
      color: var(--text-soft);
      padding: 24px;
      text-align: center;
    }
    .empty-logo { width: 64px; height: 64px; opacity: .9; margin-bottom: 6px; }
    .empty-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; }
    .empty-text { font-size: 13px; max-width: 260px; }

    /* ---------- CHAT ---------- */
    .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; }

    .chat-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .mobile-back-btn { display: none; }
    .chat-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 14px;
      cursor: pointer; flex-shrink: 0;
    }
    .chat-info { flex: 1; min-width: 0; cursor: pointer; }
    .chat-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-status { font-size: 12px; color: var(--text-soft); }
    .chat-actions { display: flex; gap: 2px; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-soft);
      display: flex; flex-direction: column;
      gap: 6px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    .recording-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      background: var(--bg-elev);
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-soft);
    }
    .rec-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--danger);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }
    .rec-timer { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
    .rec-hint { margin-left: auto; font-size: 12px; color: var(--text-mute); }

    .input-bar {
      display: flex; align-items: flex-end; gap: 6px;
      padding: 10px 12px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .input-wrapper { flex: 1; }
    .input-wrapper textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-soft);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      outline: none;
      resize: none;
      max-height: 120px;
      font-size: 13.5px;
      line-height: 1.4;
      transition: border-color .12s, background .12s;
    }
    .input-wrapper textarea:focus { border-color: var(--accent); background: var(--bg); }
    .send-btn {
      background: var(--accent); color: #fff;
      border-radius: var(--radius-sm);
    }
    .send-btn:hover { background: var(--accent-hover); color: #fff; }

    /* ---------- MODAL ---------- */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; z-index: 100;
    }
    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,.18);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
      background: var(--bg);
      z-index: 2;
    }
    .modal-header h3 { font-size: 15px; font-weight: 600; }

    .settings-modal-content { padding-bottom: 18px; }
    .settings-avatar-section {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; padding: 18px 18px 8px;
    }
    .settings-avatar {
      position: relative;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 26px;
      cursor: pointer;
      overflow: hidden;
    }
    .settings-avatar-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s;
    }
    .settings-avatar:hover .settings-avatar-overlay { opacity: 1; }
    .settings-avatar-overlay svg { width: 22px; height: 22px; color: #fff; }
    .settings-hint { font-size: 11.5px; color: var(--text-mute); }

    .settings-field { padding: 8px 18px; }
    .settings-field label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-soft);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-bottom: 5px;
    }
    .settings-field input, .settings-field textarea {
      width: 100%;
      padding: 9px 12px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      font-size: 13.5px;
      transition: border-color .12s;
    }
    .settings-field input:focus, .settings-field textarea:focus { border-color: var(--accent); }
    .settings-field textarea { resize: vertical; min-height: 64px; }
    .settings-counter { text-align: right; font-size: 11px; color: var(--text-mute); margin-top: 3px; }

    .settings-divider { height: 1px; background: var(--border); margin: 14px 18px; }
    .settings-section-title {
      padding: 0 18px 6px;
      font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .6px;
      color: var(--text-soft);
    }
    .lang-picker { display: flex; gap: 6px; padding: 0 18px 6px; flex-wrap: wrap; }
    .lang-picker button {
      padding: 6px 12px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 600;
      color: var(--text-soft);
    }
    .lang-picker button:hover { border-color: var(--accent); color: var(--text); }
    .lang-picker button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .settings-modal-content .btn-primary,
    .settings-modal-content .btn-secondary { width: calc(100% - 36px); margin: 8px 18px; }

    .settings-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 13.5px;
      border-top: 1px solid var(--border);
    }
    .settings-item:hover { background: var(--bg-soft); }
    .settings-item span:last-child { color: var(--text-soft); font-size: 12.5px; }

    .settings-footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-mute);
      padding: 14px 18px 4px;
      line-height: 1.8;
    }

    /* ---------- CALLS ---------- */
    .call-screen, .incoming-call {
      position: fixed; inset: 0;
      background: #0b0d10;
      color: #fff;
      z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      padding: 32px;
    }
    #remoteVideo {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      background: #0b0d10;
    }
    #localVideo {
      position: absolute; top: 16px; right: 16px;
      width: 120px; height: 160px;
      object-fit: cover;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.15);
      background: #1a1d21;
      z-index: 3;
    }
    .call-info {
      position: relative; z-index: 2;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; margin-top: 40px;
    }
    .call-avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 32px;
    }
    .call-name { font-size: 20px; font-weight: 600; }
    .call-status { font-size: 13px; color: rgba(255,255,255,.7); }
    .call-timer { font-variant-numeric: tabular-nums; font-size: 14px; color: rgba(255,255,255,.85); }

    .call-controls {
      position: relative; z-index: 2;
      display: flex; gap: 18px;
      margin-bottom: 16px;
    }
    .call-btn {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.15);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .call-btn:hover { background: rgba(255,255,255,.2); }
    .call-btn svg { width: 22px; height: 22px; }
    .call-btn.end { background: var(--danger); border-color: var(--danger); }
    .call-btn.end:hover { background: #b91c1c; }
    .call-btn.accept { background: var(--ok); border-color: var(--ok); }
    .call-btn.accept:hover { background: #15803d; }

    .incoming-content {
      display: flex; flex-direction: column; align-items: center;
      gap: 10px;
      margin: auto 0;
    }
    .incoming-controls { display: flex; gap: 24px; margin-top: 24px; }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translate(-50%, 20px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 300;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- МОБІЛЬНЕ ---------- */
    @media (max-width: 720px) {
      .mobile-menu-btn, .mobile-profile-btn { display: flex; }
      .app { border: none; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0;
        width: 84%; max-width: 320px;
        transform: translateX(-100%);
        transition: transform .22s ease;
        z-index: 50;
        border-right: 1px solid var(--border);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-header { padding-top: 56px; }
      .main { padding-top: 0; }
      .chat-header { padding-top: 56px; padding-left: 56px; padding-right: 56px; }
      .mobile-back-btn { display: inline-flex; position: absolute; left: 10px; top: 56px; }
      .empty-state { padding-top: 80px; }
    }
    @media (max-width: 420px) {
      .sidebar { width: 92%; }
    }
  </style>
</head>
<body>

<button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
    <line x1="3" y1="6" x2="21" y2="6"/>
    <line x1="3" y1="12" x2="21" y2="12"/>
    <line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>

<button class="mobile-profile-btn" id="mobileProfileBtn" onclick="openSettingsModal()" aria-label="Profile">
  <span id="mobileProfileAvatar">?</span>
</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div id="app" class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="logo.png" alt="MINDOFI" class="sidebar-logo">
      <span class="sidebar-title">MINDOFI</span>
      <div class="sidebar-actions">
        <button class="icon-btn" title="Theme" data-i18n-title="btn_theme" onclick="toggleTheme()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" placeholder="Search..." data-i18n-ph="search" oninput="filterChats(this.value)">
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="all" data-i18n="tab_all" onclick="switchTab('all')">All</div>
      <div class="tab" data-tab="groups" data-i18n="tab_groups" onclick="switchTab('groups')">Groups</div>
      <div class="tab" data-tab="channels" data-i18n="tab_channels" onclick="switchTab('channels')">Channels</div>
    </div>

    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <div class="me" onclick="openSettingsModal()">
        <div class="me-avatar" id="meAvatar">?</div>
        <div class="me-info">
          <div class="me-name" id="meName">—</div>
          <div class="me-status" id="meStatus" data-i18n="status_online">Online</div>
        </div>
      </div>
      <button class="icon-btn" onclick="openSettingsModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </div>
  </aside>

  <main class="main" id="mainArea">

    <div class="empty-state" id="emptyState">
      <img src="logo.png" alt="MINDOFI" class="empty-logo">
      <div class="empty-title">MINDOFI</div>
      <div class="empty-text" data-i18n="empty_text">Select a chat on the left or create a new one</div>
    </div>

    <div class="chat" id="chatArea" style="display:none">
      <div class="chat-header">
        <button class="icon-btn mobile-back-btn" onclick="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="chat-avatar" id="chatAvatar" onclick="openProfile()">?</div>
        <div class="chat-info" onclick="openProfile()">
          <div class="chat-name" id="chatName">—</div>
          <div class="chat-status" id="chatStatus"></div>
        </div>
        <div class="chat-actions">
          <button class="icon-btn" title="Audio call" data-i18n-title="btn_audio_call" onclick="initCall('audio')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.4 1.13 2 2 0 012 0h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6z"/>
            </svg>
          </button>
          <button class="icon-btn" title="Video call" data-i18n-title="btn_video_call" onclick="initCall('video')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"/>
              <rect x="1" y="5" width="15" height="14" rx="2"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div class="recording-bar" id="recordingBar" style="display:none">
        <div class="rec-dot"></div>
        <span data-i18n="recording">Recording</span>
        <span class="rec-timer" id="recordingTimer">0:00</span>
        <span class="rec-hint" data-i18n="rec_hint">Release to send</span>
      </div>

      <div class="input-bar">
        <button class="icon-btn" title="Attach file" data-i18n-title="btn_attach" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="fileInput" style="display:none" onchange="onFilePick(this)">

        <button class="icon-btn" title="Hold to record" data-i18n-title="btn_voice" id="voiceBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </button>

        <div class="input-wrapper">
          <textarea id="messageInput" rows="1" placeholder="Message..." data-i18n-ph="message_placeholder"></textarea>
        </div>

        <button class="icon-btn send-btn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>
