<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>KoderDigital — Вход</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <h1>KoderDigital</h1>
    <p class="subtitle">Введите логин и пароль</p>
    <input type="text" id="login" placeholder="Логин" autocomplete="username">
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
    <button id="loginBtn">Войти</button>
    <p id="error" class="error"></p>
  </div>
  <script src="config.js"></script>
  <script src="login.js"></script>
</body>
</html>
